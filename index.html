function g2j(gy,gm,gd){const m=[0,31,59,90,120,151,181,212,243,273,304,334],y2=gm>2?gy+1:gy;let d=355666+365*gy+((y2+3)/4|0)-((y2+99)/100|0)+((y2+399)/400|0)+gd+m[gm-1],jy=-1595+33*(d/12053|0);d%=12053;jy+=4*(d/1461|0);d%=1461;if(d>365){jy+=(d-1)/365|0;d=(d-1)%365}return d<186?[jy,1+(d/31|0),1+d%31]:[jy,7+((d-186)/30|0),1+(d-186)%30]}
function j2g(jy,jm,jd){jy+=1595;let d=-355668+365*jy+(jy/33|0)*8+(((jy%33)+3)/4|0)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186),gy=400*(d/146097|0);d%=146097;if(d>36524){gy+=100*(--d/36524|0);d%=36524;if(d>=365)d++}gy+=4*(d/1461|0);d%=1461;if(d>365){gy+=(d-1)/365|0;d=(d-1)%365}let gd=d+1;const a=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm=0;for(;gm<13;gm++){if(gd<=a[gm])break;gd-=a[gm]}return[gy,gm,gd]}
const p2=n=>String(n).padStart(2,'0'),j2i=(y,m,d)=>{const g=j2g(y,m,d);return g[0]+'-'+p2(g[1])+'-'+p2(g[2])},i2j=s=>{const[a,b,c]=s.split('-').map(Number);return g2j(a,b,c)};
const gu=y=>{const g=j2g(y,1,1);return Date.UTC(g[0],g[1]-1,g[2])},dim=(y,m)=>m<7?31:m<12?30:Math.round((gu(y+1)-gu(y))/864e5)-336;
const N=new Date(),T=g2j(N.getFullYear(),N.getMonth()+1,N.getDate());let cy=T[0],cm=T[1],ty='expense';
/* داده */
const norm=s=>({transactions:s.transactions||[],categories:{expense:(s.categories&&s.categories.expense)||[],income:(s.categories&&s.categories.income)||[]},deleted:s.deleted||{},t:s.t||0});

function merge(a,b){const del=Object.assign({},a.deleted,b.deleted),m=new Map(),u=(x,y)=>[...new Set([...x,...y])];[...a.transactions,...b.transactions].forEach(t=>{if(!del[t.id]&&!m.has(t.id))m.set(t.id,t)});return{transactions:[...m.values()],categories:{expense:u(a.categories.expense,b.categories.expense),income:u(a.categories.income,b.categories.income)},deleted:del,t:Math.max(a.t,b.t)}}
const sig=s=>JSON.stringify([s.transactions.map(t=>t.id).sort(),[...s.categories.expense].sort(),[...s.categories.income].sort(),Object.keys(s.deleted).sort()]);
function save(){S.t=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(A){clearTimeout(tm);tm=setTimeout(sync,1500)}}
async function api(m,p,b){const r=await fetch(API+p,{method:m,cache:'no-store',headers:Object.assign({'content-type':'application/json'},A?{authorization:'Bearer '+A.t}:{}),body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));j.s=r.status;return j}
async function sync(){if(!A||busy)return;busy=true;smsg='در حال هماهنگ‌سازی…';acView();
try{for(let i=0;i<3;i++){const g=await api('GET','/data');if(g.s==401){A=null;localStorage.removeItem(AK);smsg='نشست منقضی شد؛ دوباره وارد شو.';return}if(g.s!=200)throw 0;
const srv=g.d?norm(JSON.parse(g.d)):null;if(srv)S=merge(S,srv);if(srv&&sig(S)==sig(srv)){break}
const r=await api('PUT','/data',{d:JSON.stringify(S),r:g.r});if(r.s==200)break;if(r.s!=409||i==2)throw 0}
S.t=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render();smsg='هماهنگ شد ✓ '+new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}
catch(e){smsg='هماهنگ نشد؛ اینترنت رو چک کن و دوباره امتحان کن.'}
finally{busy=false;acView()}}
const ER={bad:'نام کاربری یا رمز معتبر نیست.',invite:'کد دعوت اشتباهه.',exists:'این نام کاربری قبلاً گرفته شده.',cred:'نام کاربری یا رمز اشتباهه.',locked:'چند بار اشتباه زدی؛ ۱۰ دقیقه صبر کن.'};
async function dk(u,p){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode('ledger.v1:'+u),iterations:150000,hash:'SHA-256'},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function acView(){const v=$('#acv');if(!v)return;$('#acb').classList.toggle('on',!!A);

v.innerHTML=`<div class="tg"><button class="${amode=='login'?'on pri':''}" data-a="am" data-v="login">ورود</button><button class="${amode=='signup'?'on pri':''}" data-a="am" data-v="signup">ثبت‌نام</button></div><div class="fl"><label>نام کاربری (حروف انگلیسی، عدد و _ . -)</label><input id="au" dir="ltr" autocapitalize="none" autocomplete="username" value="${esc(av)}"></div><div class="fl"><label>رمز عبور</label><input id="ap" type="password" dir="ltr" autocomplete="${amode=='login'?'current-password':'new-password'}"></div>${amode=='signup'?'<div class="fl"><label>کد دعوت</label><input id="ai" dir="ltr" autocapitalize="none"></div>':''}<div class="er" id="ae">${esc(smsg)}</div><button class="go" data-a="ao">${amode=='login'?'ورود':'ساخت حساب'}</button><p class="nt">رمز فراموش‌شده بازیابی نداره؛ حتماً یادت بمونه. بدون حساب هم می‌تونی از اپ استفاده کنی.</p>`}
async function authGo(){const u=$('#au').value.trim().toLowerCase(),p=$('#ap').value,e=$('#ae'),go=document.querySelector('#acv .go');
if(!/^[a-z0-9_.-]{3,32}$/.test(u)){e.textContent='نام کاربری باید ۳ تا ۳۲ حرف انگلیسی، عدد یا _ . - باشه.';return}

try{const k=await dk(u,p),r=await api('POST','/'+amode,{u,p:k,i:amode=='signup'?$('#ai').value.trim():undefined});
if(r.s==200){A={t:r.t,u:r.u};localStorage.setItem(AK,JSON.stringify(A));smsg='';acView();sync()}else{e.textContent=ER[r.e]||'خطایی پیش اومد؛ دوباره امتحان کن.';go.disabled=false}}
catch(x){e.textContent='ارتباط با سرور برقرار نشد.';go.disabled=false}}

/* نمودار */
function pie(it,tot){const cx=170,y0=150,r1=36,r2=56,P=(r,a)=>[cx+r*Math.cos(a),y0+r*Math.sin(a)];let a=-Math.PI/2,p='',l='';
it.forEach(x=>{const sw=x.v/tot*2*Math.PI,g=it.length>1?.035:0,a0=a+g,a1=Math.min(a+sw-g,a0+6.28),L=a1-a0>Math.PI?1:0,[x1,y1]=P(r2,a0),[x2,y2]=P(r2,a1),[x3,y3]=P(r1,a1),[x4,y4]=P(r1,a0);
p+=`<path d="M${x1} ${y1}A${r2} ${r2} 0 ${L} 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 ${L} 0 ${x4} ${y4}Z" fill="${x.c}"/>`;
const am=a+sw/2,[ex,ey]=P(r2,am),[lx,ly]=P(r2+9,am),[bx,by]=P(r2+24,am),[tx,ty2]=P(r2+53,am);
l+=`<line x1="${ex}" y1="${ey}" x2="${lx}" y2="${ly}" stroke="${x.c}" stroke-width="1.5"/><circle cx="${bx}" cy="${by}" r="13" fill="${x.c}"/>${catIc(x.n,15,'#fff',`x="${bx-7.5}" y="${by-7.5}"`)}<text x="${tx}" y="${ty2}" text-anchor="${tx>=cx?'start':'end'}" dominant-baseline="middle" font-size="13" font-weight="700" fill="${x.c}" direction="ltr" style="unicode-bidi:isolate">${pn(Math.round(x.v/tot*100))}٪</text>`;a+=sw});
return`<svg viewBox="0 0 340 300" dir="ltr" style="width:100%;max-width:360px;display:block;margin:0 auto">${p}${l}</svg>`}
function render(){

const key=cy*12+cm;let car=0;S.transactions.forEach(t=>{const j=i2j(t.date);if(j[0]*12+j[1]<key)car+=t.type=='income'?t.amount:-t.amount});const bal=car+net;
