l+=`<line x1="${ex}" y1="${ey}" x2="${lx}" y2="${ly}" stroke="${x.c}" stroke-width="1.5"/><circle cx="${bx}" cy="${by}" r="13" fill="${x.c}"/>${catIc(x.n,15,'#fff',`x="${bx-7.5}" y="${by-7.5}"`)}<text x="${tx}" y="${ty2}" text-anchor="${tx>=cx?'start':'end'}" dominant-baseline="middle" font-size="13" font-weight="700" fill="${x.c}" direction="ltr" style="unicode-bidi:isolate">${pn(Math.round(x.v/tot*100))}٪</text>`;a+=sw});
return`<svg viewBox="0 0 340 300" dir="ltr" style="width:100%;max-width:360px;display:block;margin:0 auto">${p}${l}</svg>`}
function render(){
const m=S.transactions.filter(t=>{const j=i2j(t.date);return j[0]==cy&&j[1]==cm}).sort((a,b)=>b.date.localeCompare(a.date));
const sm=k=>m.filter(t=>t.type==k).reduce((s,t)=>s+t.amount,0),inc=sm('income'),exp=sm('expense'),net=inc-exp;
$('#lb').textContent=MN[cm-1]+' '+pn(cy);
$('#st').innerHTML=`<div class="card"><small>درآمد</small><b class="income">${fa(inc)}</b></div><div class="card"><small>خرج</small><b class="expense">${fa(exp)}</b></div><div class="card"><small>مانده</small><b style="color:var(--${net<0?'c2':'md'})">${fa(net)}</b></div>`;
$('#ls').innerHTML=m.length?`<div class="rows">${m.map(t=>`<div class="r"><div class="dy">${pn(i2j(t.date)[2])}</div><div class="rm"><b>${esc(t.description)}</b><small>${esc(t.category)}</small></div><div class="am ${t.type}">${t.type=='expense'?'−':'+'}${fa(t.amount)}</div><button class="x" data-a="del" data-id="${esc(t.id)}" aria-label="حذف">${ic(['Trash2'],16,'currentColor')}</button></div>`).join('')}</div><div class="tt"><div><span>جمع درآمد</span><span>${fa(inc)} تومان</span></div><div><span>جمع خرج</span><span>${fa(exp)} تومان</span></div><div class="f"><span>مانده نهایی</span><span>${fa(net)} تومان</span></div></div>`:`<div class="em">هنوز تراکنشی برای این ماه ثبت نشده.<br>با دکمه‌ی پایین اولین مورد رو اضافه کن.</div>`;
const cs={};m.filter(t=>t.type=='expense').forEach(t=>cs[t.category]=(cs[t.category]||0)+t.amount);
const it=Object.entries(cs).sort((a,b)=>b[1]-a[1]).map(([n,v])=>({n,v,c:col(n)}));
$('#cs').hidden=!it.length;
$('#cs').innerHTML=it.length?`<h3>تفکیک هزینه‌ها بر اساس دسته</h3>${inc>0&&net<0?`<div class="os">این ماه ${fa(-net)} تومان بیشتر از درآمدت خرج کرده‌ای</div>`:''}${pie(it,exp)}${it.map(x=>`<div class="cr"><div class="t"><span><i class="bd" style="background:${x.c}">${catIc(x.n,11,'#fff')}</i>${esc(x.n)}</span><b>${fa(x.v)} <small>(${pn(Math.round(x.v/exp*100))}٪)</small></b></div><div class="br"><i style="width:${x.v/it[0].v*100}%;background:${x.c}"></i></div></div>`).join('')}`:'';
}
function pills(){const a=[];for(let i=-36;i<=12;i++){const t=T[0]*12+T[1]-1+i,y=Math.floor(t/12),mm=t-y*12+1;a.push(`<button class="p" data-a="mo" data-y="${y}" data-m="${mm}">${MN[mm-1]}${mm==1?' '+pn(y):''}</button>`)}$('#ps').innerHTML=a.join('')}
function mark(sm){document.querySelectorAll('.p').forEach(b=>{const on=b.dataset.y==cy&&b.dataset.m==cm;b.classList.toggle('on',on);if(on)b.scrollIntoView({inline:'center',block:'nearest',behavior:sm?'smooth':'auto'})})}
/* فرم */
const opts=()=>ty=='expense'?EC.concat(S.categories.expense):IN.concat(S.categories.income);
function fillCat(v){$('#ct').innerHTML=opts().map(c=>`<option>${esc(c)}</option>`).join('');if(v)$('#ct').value=v}
function days(v){const o=v||+$('#dd').value||1,n=dim(+$('#dy').value,+$('#dm').value);$('#dd').innerHTML=Array.from({length:n},(_,i)=>`<option value="${i+1}">${pn(i+1)}</option>`).join('');$('#dd').value=Math.min(o,n)}
function openF(){ty='expense';document.querySelectorAll('.tg button').forEach((x,i)=>x.classList.toggle('on',!i));$('#am').value='';$('#ds').value='';$('#r2').hidden=true;fillCat();
$('#dy').innerHTML=Array.from({length:12},(_,i)=>T[0]-10+i).map(y=>`<option value="${y}">${pn(y)}</option>`).join('');$('#dm').innerHTML=MN.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');$('#dy').value=T[0];$('#dm').value=T[1];days(T[2]);$('#sh').classList.add('on')}
const cl=()=>document.querySelectorAll('.ov2').forEach(o=>o.classList.remove('on'));
function submit(){const am=+nd($('#am').value).replace(/\D/g,'');if(!am){$('#am').focus();return}const c=$('#ct').value,y=+$('#dy').value,m=+$('#dm').value,d=+$('#dd').value;
S.transactions.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,8),type:ty,amount:am,description:$('#ds').value.trim()||c,category:c,date:j2i(y,m,d)});save();cy=y;cm=m;mark(1);render();cl()}
$('#am').addEventListener('input',e=>{const r=nd(e.target.value).replace(/\D/g,'');e.target.value=r?Number(r).toLocaleString('fa-IR'):''});
$('#dy').addEventListener('change',()=>days());$('#dm').addEventListener('change',()=>days());
document.addEventListener('click',e=>{
if(e.target.classList.contains('ov2'))return cl();
const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
if(a=='mo'){cy=+b.dataset.y;cm=+b.dataset.m;mark(1);render()}
else if(a=='del'){S.transactions=S.transactions.filter(t=>t.id!=b.dataset.id);save();render()}
else if(a=='open')openF();
else if(a=='cl')cl();
else if(a=='ty'){ty=b.dataset.v;document.querySelectorAll('.tg button').forEach(x=>x.classList.toggle('on',x==b));fillCat()}
else if(a=='nc'){$('#r2').hidden=!$('#r2').hidden;if(!$('#r2').hidden)$('#nn').focus()}
else if(a=='ac'){const n=$('#nn').value.trim();if(!n)return;const base=ty=='expense'?EC:IN,ex=S.categories[ty];if(!base.includes(n)&&!ex.includes(n)){ex.push(n);save()}fillCat(n);$('#nn').value='';$('#r2').hidden=true}
else if(a=='sv')submit();
else if(a=='bk'){$('#bo').value=JSON.stringify({transactions:S.transactions,categories:S.categories});$('#bm').textContent='';$('#bk').classList.add('on')}
else if(a=='cp'){navigator.clipboard.writeText($('#bo').value).then(()=>$('#bm').textContent='کپی شد.',()=>{$('#bo').select();$('#bm').textContent='متن انتخاب شد؛ دستی کپی کن.'})}
else if(a=='rs'){try{const p=JSON.parse($('#bi').value);if(!Array.isArray(p.transactions))throw 0;S=norm(p);save();render();$('#bi').value='';$('#bm').textContent='بازیابی انجام شد.'}catch(x){$('#bm').textContent='فرمت متن پشتیبان درست نیست.'}}
});
/* راه‌اندازی */
$('#bkb').innerHTML=ic(['Save'],18,'currentColor');$('#fab').innerHTML=ic(['Plus'],18,'#fff')+' افزودن تراکنش';$('#ncb').innerHTML=ic(['FolderPlus'],18,'currentColor');
document.querySelectorAll('.x[data-a=cl]').forEach(b=>b.innerHTML=ic(['X'],20,'currentColor'));
pills();mark(0);render();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));navigator.serviceWorker.ready.then(()=>{$('#of').textContent='حالت آفلاین: آماده ✓'});setTimeout(()=>{if(!/آماده/.test($('#of').textContent))$('#of').textContent='حالت آفلاین: هنوز فعال نشده (یک بار با اینترنت باز کن و دوباره امتحان کن)'},5000)}else $('#of').textContent='حالت آفلاین: این مرورگر پشتیبانی نمی‌کنه';
</script>
</body>
</html>
